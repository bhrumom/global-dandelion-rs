name: Controlled local benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/disk_guard.py --planned-bytes 6442450944
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Packet microbenchmark
        run: cargo bench --locked -p dandelion-packet --bench packet -- --sample-size 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packet-benchmark-${{ github.sha }}
          path: target/criterion/
          retention-days: 14
