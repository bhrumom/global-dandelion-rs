name: Controlled local benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/disk_guard.py --planned-bytes 6442450944
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Packet microbenchmark
        run: cargo bench --locked -p dandelion-packet --bench packet -- --sample-size 20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packet-benchmark-${{ github.sha }}
          path: target/criterion/
          retention-days: 14
