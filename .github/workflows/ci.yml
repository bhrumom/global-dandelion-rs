name: Rust CLI Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  quality:
    name: Quality / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Storage preflight
        run: python3 scripts/disk_guard.py --planned-bytes 6442450944
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: core-${{ matrix.target }}
          cache-on-failure: true
      - name: Formatting and architecture
        run: |
          cargo fmt --all -- --check
          python3 scripts/check_architecture.py
          python3 scripts/check_parity.py
          python3 scripts/evidence_contract_selftest.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit, property, integration and CLI tests
        run: cargo test --locked --workspace --all-features
      - name: Runnable CLI and process acceptance
        run: |
          cargo build --locked -p dandelion-app
          python3 scripts/acceptance.py --binary target/debug/dandelion > acceptance-${{ matrix.target }}.json
          cat acceptance-${{ matrix.target }}.json
          python3 scripts/tls_acceptance.py --binary target/debug/dandelion > tls-acceptance-${{ matrix.target }}.json
          cat tls-acceptance-${{ matrix.target }}.json
          python3 scripts/update_acceptance.py --binary target/debug/dandelion > update-acceptance-${{ matrix.target }}.json
          cat update-acceptance-${{ matrix.target }}.json
          python3 scripts/tui_acceptance.py --binary target/debug/dandelion > tui-acceptance-${{ matrix.target }}.json
          cat tui-acceptance-${{ matrix.target }}.json
      - name: Release storage preflight
        run: python3 scripts/disk_guard.py --planned-bytes 3221225472
      - name: Controlled packet microbenchmark
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo bench --locked -p dandelion-packet --bench packet -- --sample-size 20 --measurement-time 1 --warm-up-time 1
      - name: Build reproducible-input release artifact
        run: |
          cargo build --locked --release -p dandelion-app
          target/release/dandelion self-test --json
          mkdir -p dist
          cp target/release/dandelion dist/
          cp Cargo.lock dist/
          python3 scripts/license_report.py
          python3 scripts/python_comparison.py --binary target/release/dandelion > dist/python-rust-comparison.json
          { printf 'git_sha=%s\n' "$GITHUB_SHA"; rustc -Vv; cargo -V; } > dist/BUILD-INFO.txt
          cp acceptance-${{ matrix.target }}.json tls-acceptance-${{ matrix.target }}.json update-acceptance-${{ matrix.target }}.json tui-acceptance-${{ matrix.target }}.json dist/
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            python3 scripts/benchmark_report.py > dist/packet-benchmark.json
          fi
          (cd dist && sha256sum dandelion Cargo.lock BUILD-INFO.txt THIRD-PARTY-NOTICES.txt license-inventory.json acceptance-*.json tls-acceptance-*.json update-acceptance-*.json tui-acceptance-*.json python-rust-comparison.json > SHA256SUMS)
          if [ -f dist/packet-benchmark.json ]; then
            (cd dist && sha256sum packet-benchmark.json >> SHA256SUMS)
          fi
          tar -czf dandelion-${{ matrix.target }}.tar.gz -C dist .
          sha256sum dandelion-${{ matrix.target }}.tar.gz > dandelion-${{ matrix.target }}.tar.gz.sha256
          mkdir package-check
          tar -xzf dandelion-${{ matrix.target }}.tar.gz -C package-check
          test -x package-check/dandelion
          (cd package-check && sha256sum --check SHA256SUMS)
          package-check/dandelion self-test --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dandelion-${{ matrix.target }}-${{ github.sha }}
          path: |
            dandelion-${{ matrix.target }}.tar.gz
            dandelion-${{ matrix.target }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Storage preflight
        run: python3 scripts/disk_guard.py --planned-bytes 8589934592
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: security-tools
          cache-on-failure: true
      - name: Install audit tools on disposable runner only
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo install cargo-deny --version 0.20.2 --locked
      - name: RustSec advisory audit
        run: cargo audit
      - name: Supply-chain and license policy
        if: success() || failure()
        run: cargo deny --locked check
  gate:
    name: Required acceptance gate
    if: always()
    needs: [quality, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs must succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
        run: test "$QUALITY" = success && test "$DEPENDENCIES" = success
