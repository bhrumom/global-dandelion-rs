name: Offline Mini App
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mini app version to package"
        required: true
        default: "0.2.0"
        type: string
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  MINIAPP_VERSION: ${{ github.event.inputs.version || '0.2.0' }}
jobs:
  offline-miniapp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.TESTED_COMMIT }}
      - name: Disk preflight
        run: python3 scripts/disk_guard.py --path . --planned-bytes 8589934592
      - name: Pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate Marketplace install metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('miniapp/marketplace-draft.json').read_text())
          identity = value['identity']
          runtime = value.get('runtime')
          expected = {
              'owner': 'host-plugins',
              'installMode': 'fabapp',
              'appId': 'org.fabushi.global-dandelion',
              'publisherId': identity['namespace'],
          }
          if not isinstance(runtime, dict) or any(runtime.get(k) != v for k, v in expected.items()):
              raise SystemExit('Marketplace descriptor is not installable by the Desktop Host')
          if identity != {'namespace': 'bhrumom', 'name': 'global-dandelion', 'kind': 'web-miniapp'}:
              raise SystemExit('unexpected Marketplace identity')
          print('Marketplace install metadata: valid')
          PY
      - name: Host tool contract
        # Pure page-side contract: every bridge shape the three hosts inject.
        run: node --test miniapp/scripts/test_host_tools.mjs
      - name: Resolve separate Web adapter lockfile
        run: |
          if test -f miniapp/wasm/Cargo.lock; then
            cargo fetch --manifest-path miniapp/wasm/Cargo.toml --locked
          else
            cargo generate-lockfile --manifest-path miniapp/wasm/Cargo.toml
          fi
      - name: Adapter format and tests
        run: |
          cargo fmt --manifest-path miniapp/wasm/Cargo.toml -- --check
          cargo test --manifest-path miniapp/wasm/Cargo.toml --locked
          cargo clippy --manifest-path miniapp/wasm/Cargo.toml --locked --all-targets -- -D warnings
      - name: Preserve third-party notices from resolved dependencies
        working-directory: miniapp/wasm
        run: |
          mkdir -p dist
          python3 ../../scripts/license_report.py
      - name: Build Web adapter and matching bindings
        run: |
          cargo build --manifest-path miniapp/wasm/Cargo.toml --locked --release --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          wasm-bindgen miniapp/wasm/target/wasm32-unknown-unknown/release/dandelion_web_adapter.wasm --target web --out-dir miniapp-generated
      - name: Prepare unsigned resources
        run: python3 miniapp/scripts/package.py --pkg miniapp-generated --resources miniapp-resources --commit "$TESTED_COMMIT" --version "$MINIAPP_VERSION" --output global-dandelion-UNSIGNED.zip
      - name: Android single-document bundle
        # Android injects one HTML string, so this variant must carry every module.
        run: |
          python3 miniapp/scripts/test_inline_html.py
          python3 miniapp/scripts/package.py --pkg miniapp-generated --resources miniapp-resources-android --commit "$TESTED_COMMIT" --version "$MINIAPP_VERSION" --inline-html "global-dandelion-${MINIAPP_VERSION}.html" --output global-dandelion-UNSIGNED-android.zip
      - name: Install test-only tools
        run: |
          python3 -m pip install cryptography==46.0.3
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Package adversarial tests
        run: python3 miniapp/scripts/test_package.py miniapp-resources
      - name: Offline browser contracts
        run: node miniapp/scripts/test_browser.cjs miniapp-resources
      - name: Preserve preparation evidence (not a published release)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-miniapp-preparation-${{ env.TESTED_COMMIT }}
          path: |
            global-dandelion-UNSIGNED.zip
            global-dandelion-UNSIGNED.zip.sha256
            global-dandelion-UNSIGNED-android.zip
            global-dandelion-UNSIGNED-android.zip.sha256
            global-dandelion-${{ env.MINIAPP_VERSION }}.html
            miniapp-resources
            miniapp/wasm/Cargo.lock
            miniapp-ui*.png
