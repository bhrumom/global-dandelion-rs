<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Global Dandelion · Fabushi</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header class="globe-header"><div class="brand-orbit" aria-hidden="true">✳</div><div><p class="eyebrow">GLOBAL DANDELION</p><h1>全球法布施</h1></div><span class="badge" id="host-badge">本地运行</span></header>
    <section class="earth-stage" aria-label="三维地球与运行状态">
      <p class="earth-caption">让善意流转 · 让每一块数据有据可查</p>
      <div class="earth-halo"><canvas id="earth" width="800" height="650" tabindex="0" role="img" aria-label="3D 地球，可拖动或用方向键旋转"></canvas></div>
      <p id="earth-fallback" role="status" hidden></p>
      <div class="earth-readout"><span class="live-dot"></span><span id="globe-state" role="status" aria-live="polite">正在加载 Rust 地球…</span></div>
      <p id="location-summary" class="location-summary">所在点未设置 · 拖动地球旋转</p>
    </section>
    <section class="composer-panel" aria-label="法布施发送面板">
      <div class="composer-options"><label>模式 <select id="mode" aria-label="模式"><option value="local">本地转轮</option><option value="global">全球发送</option><option value="hotspot">热点场能</option></select></label><label class="loop-toggle"><input id="cycles" type="checkbox" aria-label="无限循环">循环 ∞</label><button id="open-settings" class="text-button" aria-expanded="false" aria-controls="composer-settings">设置 ⚙</button><span id="engine-indicator">RUST · GDAN v2</span></div>
      <div id="composer-settings" class="route-settings" hidden><div class="speed-fields"><label>本地回环速度（KiB/s）<input id="rate-local" type="number" min="1" max="1048576" step="1" value="1024" required></label><label>全球发送速度（KiB/s）<input id="rate-global" type="number" min="1" max="1048576" step="1" value="64" required></label><label>热点传输速度（KiB/s）<input id="rate-hotspot" type="number" min="1" max="1048576" step="1" value="1024" required></label></div><button id="import-config" class="secondary">导入接收端与授权配置</button><p id="settings-status" role="status">全球发送面向世界各地已授权的兼容接收端。</p><p>坐标只用于地图显示，不授予发送权限；未设置真实端点时不绘制虚构轨迹。</p><div class="coordinate-fields"><label>所在纬度<input id="origin-lat" type="number" min="-90" max="90" step="any" placeholder="-90…90"></label><label>所在经度<input id="origin-lon" type="number" min="-180" max="180" step="any" placeholder="-180…180"></label><button id="set-origin" class="secondary">设置所在点</button><button id="locate" class="secondary">使用设备位置</button><label>授权目标<select id="composer-target" aria-label="授权目标"></select></label><label>目标纬度<input id="destination-lat" type="number" min="-90" max="90" step="any" placeholder="-90…90"></label><label>目标经度<input id="destination-lon" type="number" min="-180" max="180" step="any" placeholder="-180…180"></label></div><p id="route-status" role="status"></p></div>
      <div class="composer-box"><button id="attach" class="attach" aria-label="添加文件" title="添加文件">＋</button><textarea id="message" rows="2" maxlength="16384" placeholder="输入文字，或点击 ＋ 添加文件…" aria-label="输入文字"></textarea><button id="launch" class="launch" aria-label="开始运行" disabled>↑</button><button id="stop-composer" class="stop-composer" aria-label="停止运行" hidden>■</button><input type="file" id="composer-files" multiple hidden></div>
      <div class="composer-bottom"><span id="composer-selection">尚未添加文件</span><button id="clear-composer" class="text-button">清空</button></div>
      <ul id="composer-file-list" aria-label="待处理文件"></ul><p id="mode-description">本地转轮：在本机用 Rust 完成 GDAN 编码与解码回环，不发送网络数据。</p>
      <p id="composer-status" role="status" aria-live="polite">等待 Rust 内核…</p><progress id="composer-progress" max="1" value="0" aria-label="运行进度"></progress>
      <div class="composer-metrics"><span>已完成 <strong id="composer-pass">0</strong></span><span>已校验 <strong id="composer-bytes">0 B</strong></span><span>数据包 <strong id="composer-packets">0</strong></span><button id="composer-export" class="text-button" disabled>导出报告 ↗</button></div>

    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
